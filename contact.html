<main><section class="wrap narrow"><h1>Contact me</h1><p>Send a message.</p>
<form id="contactForm" novalidate>
<label for="name">Name</label><input id="name" name="name" type="text" autocomplete="name"><span class="err" id="nameErr"></span>
<label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email"><span class="err" id="emailErr"></span>
<label for="phone">Phone number</label><input id="phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel"><span class="err" id="phoneErr"></span>
<label for="message">Message</label><textarea id="message" name="message" rows="5"></textarea><span class="err" id="messageErr"></span>
<button class="btn" type="submit">Send message</button><p id="status" class="ok" role="status"></p></form></section></main>
